<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Songooner has moved</title>
    <link rel="canonical" href="https://rithulbhat.github.io/recreation_residency/#/songooner" />
    <meta http-equiv="refresh" content="0; url=https://rithulbhat.github.io/recreation_residency/#/songooner" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #0b0b12; color: #f4f4f8;
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        text-align: center; padding: 24px;
      }
      .card { max-width: 30rem; }
      h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
      .grad {
        background: linear-gradient(90deg, #a855f7, #22d3ee, #f472b6);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color: #a9a9c0; line-height: 1.5; margin: 0 0 1.5rem; }
      a.btn {
        display: inline-block; padding: .85rem 1.5rem; border-radius: 999px;
        background: linear-gradient(90deg, #a855f7, #22d3ee); color: #0b0b12;
        font-weight: 700; text-decoration: none;
      }
      a.alt { display: block; margin-top: 1rem; color: #a9a9c0; font-size: .9rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Songooner now lives in the <span class="grad">Residency</span></h1>
      <p>Same game, new address. Taking you there now.</p>
      <a class="btn" href="https://rithulbhat.github.io/recreation_residency/#/songooner">Open Songooner</a>
      <a class="alt" href="https://rithulbhat.github.io/recreation_residency/">or visit Rithul's Recreation Residency</a>
    </div>
  </body>
</html>
